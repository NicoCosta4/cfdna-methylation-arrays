# Builds the Docker image and publishes it to GitHub Container Registry (ghcr.io)
# whenever the environment changes. Analysis-only commits (scripts, README) do
# not change the image, so they don't trigger a rebuild.
name: Docker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/docker-image.yml
  workflow_dispatch:  # manual run from the Actions tab

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nicocosta4/cfdna-methylation-arrays  # registry names must be lowercase

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      # linux/amd64 only: the target is HPC clusters (x86_64). On Apple Silicon,
      # build the image locally instead of pulling it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
